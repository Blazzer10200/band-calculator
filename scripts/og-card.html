<!doctype html>
<!-- Source for og.png, the link preview Discord and friends show. Regenerate with scripts/og-card.ps1. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{font-family:Geist,sans-serif;color:#edece8;background:#0f0f0e}
  .wrap{display:grid;grid-template-columns:1fr 460px;gap:72px;align-items:center;height:100%;padding:0 80px}
  .brand{display:flex;align-items:center;gap:16px;margin-bottom:44px}
  .brand img{width:56px;height:56px}
  .brand span{font:600 26px Geist,sans-serif;letter-spacing:-.01em}
  .eyebrow{font:500 17px 'Geist Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:#8e8d88}
  .total{margin-top:18px;font:300 132px/0.95 Geist,sans-serif;letter-spacing:-.045em;font-variant-numeric:tabular-nums}
  .bar{display:flex;gap:4px;height:5px;margin-top:40px}
  .bar i{height:100%;border-radius:2px;background:var(--c);width:var(--w)}
  p{margin-top:30px;font-size:25px;line-height:1.45;color:#8e8d88;max-width:560px}
  .rows{border-top:1px solid #2a2a28}
  .row{display:grid;grid-template-columns:14px 1fr auto 150px;align-items:center;gap:16px;white-space:nowrap;height:68px;border-bottom:1px solid #1c1c1b;font-size:22px;font-weight:500}
  .row i{width:14px;height:14px;border-radius:50%;background:var(--c)}
  .row small{font:400 19px 'Geist Mono',monospace;color:#8e8d88}
  .row b{font:400 22px 'Geist Mono',monospace;text-align:right;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="wrap">
  <div>
    <div class="brand"><img src="../logo.svg" alt=""><span>Band Calculator</span></div>
    <div class="eyebrow">Total</div>
    <div class="total">$364,000</div>
    <div class="bar"><i style="--c:#b28b6f;--w:57.7%"></i><i style="--c:#82aef5;--w:24.7%"></i><i style="--c:#ba98e4;--w:10.3%"></i><i style="--c:#e4e5e0;--w:3.8%"></i><i style="--c:#f2e23a;--w:3.4%"></i></div>
    <p>Count your bands or paste a screenshot of your inventory. See what it's worth.</p>
  </div>
  <div class="rows">
    <div class="row"><i style="--c:#f2e23a"></i>Yellow band<small>×1</small><b>$12,500</b></div>
    <div class="row"><i style="--c:#b28b6f"></i>Brown band<small>×35</small><b>$210,000</b></div>
    <div class="row"><i style="--c:#ba98e4"></i>Purple band<small>×15</small><b>$37,500</b></div>
    <div class="row"><i style="--c:#82aef5"></i>Blue band<small>×60</small><b>$90,000</b></div>
    <div class="row"><i style="--c:#e4e5e0"></i>White band<small>×140</small><b>$14,000</b></div>
  </div>
</div>
</body>
</html>
